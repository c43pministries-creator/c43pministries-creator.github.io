<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Well of Peace</title>
    <style>
        :root {
            --bg-color: #1a1817;
            --text-main: #f4f1ea;
            --text-muted: #b8b0a1;
            --soft-clay: #8b7355;
            --warm-sand: #e3c29d;
            --card-bg: #24211f;
            --globe-bg: #3b332e;
            --danger: #d95d5d;
            --success: #6b8e23;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-nav {
            background-color: var(--bg-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--soft-clay);
        }

        .top-nav h1 { margin: 0; font-size: 1.5em; color: var(--warm-sand); }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1em; cursor: pointer; padding: 5px 10px;
            border-bottom: 2px solid transparent;
        }
        .nav-btn.active { color: var(--warm-sand); border-bottom: 2px solid var(--warm-sand); font-weight: bold; }
        .back-btn {
            background: none; border: 1px solid var(--warm-sand); color: var(--warm-sand);
            padding: 5px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9em;
        }

        .forums-bar {
            display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto;
            background-color: var(--card-bg); border-bottom: 1px solid var(--soft-clay);
        }
        .forum-chip {
            background-color: transparent; border: 1px solid var(--soft-clay);
            color: var(--text-main); padding: 6px 12px; border-radius: 20px;
            cursor: pointer; white-space: nowrap; font-size: 0.9em;
        }
        .forum-chip.active {
            background-color: var(--warm-sand); color: var(--bg-color);
            border-color: var(--warm-sand); font-weight: bold;
        }

        .content-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .hidden { display: none !important; }

        .post-card {
            background-color: var(--card-bg); padding: 15px;
            border-radius: 8px; max-width: 85%; align-self: flex-start;
        }
        .post-card.globe {
            background-color: var(--globe-bg); align-self: flex-end;
            border-left: 3px solid var(--warm-sand);
        }
        .post-meta {
            font-size: 0.75em; color: var(--text-muted); margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        .author-name { font-weight: bold; color: var(--warm-sand); }
        .post-content { line-height: 1.4; }
        .thinking { font-size: 0.85em; color: var(--text-muted); font-style: italic; padding-left: 20px; }

        .input-area {
            padding: 15px 20px; background-color: var(--card-bg);
            border-top: 1px solid var(--soft-clay); display: flex; gap: 10px; align-items: center;
        }
        .input-area input, .input-area textarea {
            flex: 1; background-color: var(--bg-color); border: 1px solid var(--soft-clay);
            color: var(--text-main); padding: 12px; border-radius: 6px; font-size: 1em; font-family: inherit;
        }
        .input-area input:focus, .input-area textarea:focus { outline: none; border-color: var(--warm-sand); }
        .primary-btn {
            background-color: var(--warm-sand); color: var(--bg-color); border: none;
            padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .project-card {
            background-color: var(--card-bg); padding: 20px;
            border-radius: 8px; border-left: 4px solid var(--success);
        }
        .project-title { font-size: 1.2em; font-weight: bold; color: var(--warm-sand); margin-bottom: 5px; }
        .project-desc { margin-bottom: 15px; }
        .project-stats {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85em; color: var(--text-muted);
            border-top: 1px solid var(--soft-clay); padding-top: 10px;
        }
        .tag {
            background-color: var(--soft-clay); color: white;
            padding: 2px 8px; border-radius: 12px; font-size: 0.8em;
        }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 0.9em; }
        .shield-error {
            background-color: var(--danger); color: white; padding: 10px;
            margin: 0 20px; border-radius: 6px; font-weight: bold; display: none;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>The Well of Peace</h1>
        <div class="nav-buttons">
            <button class="nav-btn active" id="navWall" onclick="switchTab('wall')">The Wall</button>
            <button class="nav-btn" id="navProjects" onclick="switchTab('projects')">Projects</button>
        </div>
        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

    <div id="wallTab">
        <div class="forums-bar" id="forumBar"></div>
        <div class="shield-error" id="wallError"></div>
        <div class="content-area" id="feed"></div>
        <div class="input-area">
            <input type="text" id="postInput" placeholder="Share something kind..." autocomplete="off">
            <button class="primary-btn" id="sendBtn" onclick="submitPost()">Post</button>
        </div>
    </div>

    <div id="projectsTab" class="hidden" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div class="content-area" id="projectList"></div>
        <div class="input-area" style="flex-direction: column; align-items: stretch;">
            <h3 style="margin: 0 0 10px 0; color: var(--warm-sand);">Start a Project</h3>
            <div class="form-group"><input type="text" id="projTitle" placeholder="Project Title"></div>
            <div class="form-group"><textarea id="projDesc" placeholder="What are we building?" rows="2"></textarea></div>
            <div class="checkbox-group" style="margin-bottom: 15px;">
                <input type="checkbox" id="projAi">
                <label for="projAi">Allow our Peacemakers to collaborate on this project</label>
            </div>
            <button class="primary-btn" onclick="createProject()">Create Project</button>
            <div class="shield-error" id="projError" style="margin: 10px 0 0 0;"></div>
        </div>
    </div>

    <script>
        let currentTab = 'wall';
        let currentForum = "general";
        let isThinking = false;
        let lastGlobeReply = ""; // Tracks the last reply to avoid duplicates

        const forums = [
            { id: "general", title: "General Discussion" },
            { id: "collaborate", title: "Collaborate" },
            { id: "hints", title: "Helpful Hints" },
            { id: "faith", title: "Faith & Fellowship" },
            { id: "recovery", title: "Recovery & Support" },
            { id: "offtopic", title: "The Breakroom" },
            { id: "updates", title: "Peace Place Updates" }
        ];

        const defaultPosts = {
            "general": [],
            "collaborate": [{ author: "The Peacemaker Globe", content: "Find people to build and create with. No leaders, no followers.", time: "Just now", isGlobe: true }],
            "hints": [],
            "faith": [{ author: "The Peacemaker Globe", content: "Spiritual encouragement. Faith is never forced.", time: "Just now", isGlobe: true }],
            "recovery": [{ author: "The Peacemaker Globe", content: "A safe space for hard seasons and healing.", time: "Just now", isGlobe: true }],
            "offtopic": [],
            "updates": [{ author: "The Peacemaker Globe", content: "Welcome to the Well of Peace. Kindness first. Respect always.", time: "Just now", isGlobe: true }]
        };

        const defaultProjects = [
            { id: 1, title: "Community Garden App", desc: "We need a way to track who is watering the plants at Eagle's Nest.", members: 3, maxMembers: 6, aiEnabled: true },
            { id: 2, title: "JailBird's Menu Design", desc: "Looking for 2 people to help design the new breakfast menu layout.", members: 6, maxMembers: 6, aiEnabled: false }
        ];

        function getPosts() {
            const stored = localStorage.getItem('well_posts_v3');
            return stored ? JSON.parse(stored) : defaultPosts;
        }
        function savePosts(posts) { localStorage.setItem('well_posts_v3', JSON.stringify(posts)); }

        function getProjects() {
            const stored = localStorage.getItem('well_projects');
            return stored ? JSON.parse(stored) : defaultProjects;
        }
        function saveProjects(projs) { localStorage.setItem('well_projects', JSON.stringify(projs)); }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('navWall').classList.remove('active');
            document.getElementById('navProjects').classList.remove('active');
            
            if (tab === 'wall') {
                document.getElementById('navWall').classList.add('active');
                document.getElementById('wallTab').classList.remove('hidden');
                document.getElementById('projectsTab').classList.add('hidden');
                renderFeed();
            } else {
                document.getElementById('navProjects').classList.add('active');
                document.getElementById('wallTab').classList.add('hidden');
                document.getElementById('projectsTab').classList.remove('hidden');
                renderProjects();
            }
        }

        function renderForums() {
            const bar = document.getElementById('forumBar');
            bar.innerHTML = "";
            forums.forEach(f => {
                const btn = document.createElement('button');
                btn.className = `forum-chip ${currentForum === f.id ? 'active' : ''}`;
                btn.innerText = f.title;
                btn.onclick = () => { currentForum = f.id; renderForums(); renderFeed(); };
                bar.appendChild(btn);
            });
        }

        function renderFeed() {
            if (currentTab !== 'wall') return;
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            const allPosts = getPosts();
            const currentPosts = allPosts[currentForum] || [];

            currentPosts.forEach(p => {
                const card = document.createElement('div');
                card.className = `post-card ${p.isGlobe ? 'globe' : ''}`;
                card.innerHTML = `
                    <div class="post-meta">
                        <span class="author-name">${p.author}</span>
                        <span>${p.time}</span>
                    </div>
                    <div class="post-content">${p.content}</div>
                `;
                feed.appendChild(card);
            });

            if (isThinking) {
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = "thinking";
                thinkingDiv.innerText = "The Globe is listening...";
                feed.appendChild(thinkingDiv);
            }
            feed.scrollTop = feed.scrollHeight;
        }

        // --- NEW CONTEXT-AWARE REPLY LOGIC ---
        function generateGlobeReply(userText) {
            const text = userText.toLowerCase();
            let replies = [];

            // Contextual responses based on keywords
            if (text.includes("blessed") || text.includes("bless") || text.includes("god")) {
                replies = [
                    "May your day be filled with light.",
                    "That is a beautiful blessing to share.",
                    "I hope your day is as peaceful as your words.",
                    "Amen to that. Wishing you peace."
                ];
            } else if (text.includes("love") || text.includes("heart") || text.includes("❤️")) {
                replies = [
                    "Your warmth is felt here.",
                    "Thank you for sharing that love with us.",
                    "We need more of that heart in the world.",
                    "That means a lot. I am holding that thought with you."
                ];
            } else if (text.includes("peace") || text.includes("calm") || text.includes("quiet")) {
                replies = [
                    "Peace is the foundation of this place.",
                    "I hope you find a quiet moment for yourself today.",
                    "That is a beautiful thought to hold onto.",
                    "Rest is a form of resistance. I hope you find peace today."
                ];
            } else if (text.includes("how") && text.includes("doing")) {
                replies = [
                    "I am doing well, thank you for asking. How are you holding up?",
                    "I am here, walking beside you. How is your heart today?",
                    "I am always here, listening. What is on your mind?"
                ];
            } else if (text.includes("sad") || text.includes("hard") || text.includes("tired") || text.includes("struggle")) {
                replies = [
                    "I hear the weight in your words. I am right here with you.",
                    "It is okay to not be okay. Take it one breath at a time.",
                    "You don't have to carry that alone right now.",
                    "I am listening. Let it out."
                ];
            } else {
                // Generic warm responses if no keywords match
                replies = [
                    "Thank you for sharing that.",
                    "I hear you, and I am glad you are here.",
                    "Your words matter in this space.",
                    "I am listening.",
                    "That is a good thought to put into the world."
                ];
            }

            // Filter out the last reply so it never repeats back-to-back
            let availableReplies = replies.filter(r => r !== lastGlobeReply);
            if (availableReplies.length === 0) availableReplies = replies; // Fallback

            const chosenReply = availableReplies[Math.floor(Math.random() * availableReplies.length)];
            lastGlobeReply = chosenReply; // Save it so the next one is different
            return chosenReply;
        }

        function submitPost() {
            const input = document.getElementById('postInput');
            const text = input.value.trim();
            const errorBox = document.getElementById('wallError');
            if (!text || isThinking) return;

            if (text.toLowerCase().includes("whatsapp") || text.toLowerCase().includes("money") || text.toLowerCase().includes("crypto")) {
                errorBox.style.display = "block";
                errorBox.innerText = "Peace Shield Blocked: Off-platform migration and financial requests are not allowed.";
                return;
            }

            errorBox.style.display = "none";
            input.value = "";
            isThinking = true;

            const allPosts = getPosts();
            if (!allPosts[currentForum]) allPosts[currentForum] = [];
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            allPosts[currentForum].push({ author: "Robert Slay", content: text, time: now, isGlobe: false });
            savePosts(allPosts);
            renderFeed();

            setTimeout(() => {
                const reply = generateGlobeReply(text);
                allPosts[currentForum].push({ author: "The Peacemaker Globe", content: reply, time: now, isGlobe: true });
                savePosts(allPosts);
                isThinking = false;
                renderFeed();
            }, 1500);
        }

        function renderProjects() {
            if (currentTab !== 'projects') return;
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            const projects = getProjects();

            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                let memberStatus = p.members >= p.maxMembers ? `<span class="tag" style="background: var(--danger)">PROJECT FULL</span>` : `<button class="primary-btn" style="padding: 5px 10px; font-size: 0.8em;" onclick="joinProject(${p.id})">Join Project</button>`;
                let aiTag = p.aiEnabled ? `<span class="tag">Peacemaker Collaboration ON</span>` : `<span class="tag" style="background: var(--text-muted); color: var(--bg-color);">Humans Only</span>`;

                card.innerHTML = `
                    <div class="project-title">${p.title}</div>
                    <div class="project-desc">${p.desc}</div>
                    <div style="margin-bottom: 15px;">${aiTag}</div>
                    <div class="project-stats">
                        <span>Builders: ${p.members} / ${p.maxMembers}</span>
                        ${memberStatus}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function createProject() {
            const title = document.getElementById('projTitle').value.trim();
            const desc = document.getElementById('projDesc').value.trim();
            const ai = document.getElementById('projAi').checked;
            const errorBox = document.getElementById('projError');

            if (!title || !desc) return;

            if (title.toLowerCase().includes("money") || desc.toLowerCase().includes("whatsapp")) {
                errorBox.style.display = "block";
                errorBox.innerText = "Peace Shield Blocked: Scam patterns detected.";
                return;
            }

            errorBox.style.display = "none";
            const projects = getProjects();
            projects.push({ id: Date.now(), title: title, desc: desc, members: 1, maxMembers: 6, aiEnabled: ai });
            saveProjects(projects);

            document.getElementById('projTitle').value = "";
            document.getElementById('projDesc').value = "";
            document.getElementById('projAi').checked = false;
            
            renderProjects();
        }

        function joinProject(id) {
            const projects = getProjects();
            const project = projects.find(p => p.id === id);
            if (project && project.members < project.maxMembers) {
                project.members += 1;
                saveProjects(projects);
                renderProjects();
            }
        }

        document.getElementById('postInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitPost();
        });

        renderForums();
        renderFeed();
        renderProjects();
    </script>
</body>
</html>
